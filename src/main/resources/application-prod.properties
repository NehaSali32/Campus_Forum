# =========================================================================
# Campus Forum - Production Profile Configuration
# Active with: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# =========================================================================

# Enforce environment variables in production
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.initial-admin.password=${ADMIN_PASSWORD:}

# Production JPA settings (avoid automatic DDL changes in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Strict session cookie security
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Disable all demo data seeding in production
app.seed-demo-data=false
