# =========================================================================
# Campus Forum - Application Configuration
# =========================================================================

# Server Configuration
server.port=${PORT:8080}

# Session Cookie Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=CAMPUSFORUM_SESSION
server.servlet.session.timeout=24h

# MySQL Database Configuration (Environment variable driven)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_connect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Durgesh@7384}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=${UPLOAD_DIR:uploads}

# Static Resources
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# Jackson Serialization Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Initial Administrator & Seeding Configuration
app.initial-admin.email=${ADMIN_EMAIL:admin@campusforum.edu}
app.initial-admin.password=${ADMIN_PASSWORD:Admin@Campus2026}
app.seed-demo-data=${SEED_DEMO_DATA:false}
